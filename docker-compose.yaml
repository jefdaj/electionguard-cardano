# Single EGC node: cardano + ogmios + ipfs + egc
#
# Get it running:
# 1. ./quickstart.sh OR docker compose up
# 2. docker exec -it egcnode-egc-1 egc
#
# Re-use existing cardano node config + data:
#   EGC_CARDANO_DIR=/path/to/cardano docker compose up
#
# Check that everything is working:
# 1. cardano: docker compose logs cardano --follow | grep 'new tip'
# 2. ogmios: http://localhost:1337/
# 3. ipfs: http://localhost:5001/webui/ or docker compose logs ipfs
# 4. egc: docker exec -it egcnode-egc-1 egc node status

# TODO ghc runtime flags to reduce peak ram

name: egcnode

services:

  cardano:
    image: ghcr.io/intersectmbo/cardano-node:11.0.1
    restart: no # restart in production?
    command:
      - run
      - --config
      - /config/config.json
      - --database-path
      - /data/db
      - --socket-path
      - /ipc/node.socket
      - --topology
      - /config/topology.json
      - +RTS
      - -A16m
      - -IO
      - -F1.5
      - --disable-delayed-os-memory-return
      - -RTS
    volumes:
      - ${EGC_CARDANO_DIR:-./cardano}/config/network/${CARDANO_NETWORK:-preview}/cardano-node:/config
      - ${EGC_CARDANO_DIR:-./cardano}/data/node-db:/data/node/db
      - ${EGC_CARDANO_DIR:-./cardano}/data/node-lsm:/data/node/lsm
      - ${EGC_CARDANO_DIR:-./cardano}/data/node-ipc:/ipc
      - ${EGC_CARDANO_TOPOLOGY}:/config/topology.json
    stop_signal: SIGINT
    oom_score_adj: -500 # kill other processes first
    security_opt:
      - seccomp=./cardano/seccomp.json # allow io_uring calls needed by LSM backend
    stop_grace_period: 5m # minimize chances of having to re-sync after unclean shutdown
    # network_mode: host # TODO remove

  # This is a new (experimental) method to quickly download the Cardano
  # blockchain. Validators collectively sign a hash of the agreed upon state
  # each epoch, so when joining the network you can just download everything in
  # bulk and verify a few signatures rather than going block by block. It's
  # totally optional.  Warning: because of an issue with the first version of
  # the spec, this also has to trust an "ancillary verification" key from IOG
  # (the company that originally built Cardano) to sign a few files that aren't
  # included in the main hash. Hopefully that can be removed soon!
  # USAGE: run ./quickstart.sh rather than `docker compose up` the first run
  mithril:
    profiles: ["quickstart"]
    # image: ghcr.io/intersectmbo/mithril-client:latest
    image: ghcr.io/intersectmbo/mithril-client:2642.0-e85df3d
    user: "${MITHRIL_UID:-0}:${MITHRIL_GID:-0}"
    environment:
      NETWORK: ${CARDANO_NETWORK:-preview}
      AGGREGATOR_ENDPOINT: ${MITHRIL_AGGREGATOR_ENDPOINT:-https://aggregator.pre-release-preview.api.mithril.network/aggregator}
      GENESIS_VERIFICATION_KEY: ${MITHRIL_GENESIS_VERIFICATION_KEY:?Set MITHRIL_GENESIS_VERIFICATION_KEY (see .env)}
      MITHRIL_ANCILLARY_VERIFICATION_KEY: ${MITHRIL_ANCILLARY_VERIFICATION_KEY:?Set MITHRIL_ANCILLARY_VERIFICATION_KEY (see .env)}
    volumes:
      - ${EGC_CARDANO_DIR:-./cardano}/data/node-db:/data
    command:
      - cardano-db
      - download
      - latest
      - --download-dir
      - /data
      - --include-ancillary
      - --ancillary-verification-key
      - ${MITHRIL_ANCILLARY_VERIFICATION_KEY}

  # Ogmios provides an API for the Cardano node.
  ogmios:
    # TODO update once node 11 stuff is worked out:
    image: ghcr.io/intersectmbo/ogmios:v6.14.0.3
    restart: no # restart in production?
    depends_on:
      - cardano
    command:
      - --host
      - 0.0.0.0
      - --node-socket
      - /ipc/node.socket
      - --node-config
      - /config/cardano-node/config.json
    volumes:
      - ${EGC_CARDANO_DIR:-./cardano}/data/node-ipc:/ipc
      - ${EGC_CARDANO_DIR:-./cardano}/config/network/${CARDANO_NETWORK:-preview}:/config
    ports:
      - "1337:1337"
    environment:
      NETWORK: ${CARDANO_NETWORK:-preview}
      OGMIOS_PORT: "1337"
    stop_signal: SIGINT
    stop_grace_period: 60s

  ipfs:
    image: ipfs/kubo:v0.42.0
    restart: no # restart in production?
    volumes:
      - type: tmpfs
        target: /data
      - type: bind
        source: ./ipfs/ipfs-init.sh
        target: /container-init.d/001-config.sh
        read_only: true
      - type: bind
        source: ./ipfs/ipfs-caps.json
        target: /data/ipfs/libp2p-resource-limit-overrides.json
        read_only: true
    environment:
      IPFS_IMPORT_CIDVERSION: "1"
      IPFS_LOGGING: info
      IPFS_TELEMETRY: "off"
    ports:
      - "4001:4001"            # ipfs swarm
      - "127.0.0.1:5001:5001"  # api access

  egc:
    # TODO push to ghcr for release:
    # image: ghcr.io/jefdaj/electionguard-cardano:0.6.1
    image: electionguard-cardano:0.6.1
    restart: no # restart in production?
    depends_on:
      - ogmios
      - ipfs
    environment:
      IPFS_API_ADDR: /dns4/ipfs/tcp/5001
      OGMIOS_HOST: ogmios
      OGMIOS_PORT: "1337"
