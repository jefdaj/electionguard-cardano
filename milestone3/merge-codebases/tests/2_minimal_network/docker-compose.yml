name: egctest
services:
  node:
    image: ghcr.io/intersectmbo/cardano-node:11.0.1
    command: [
      "run",
      "--config", "/config/config.json",
      "--database-path", "/data/db",
      "--socket-path", "/ipc/node.socket",
      "--topology", "/config/topology.json"
    ]
    volumes:
      - ../../../../milestone2/cardano-node-ogmios/config/network/${NETWORK:-preview}/cardano-node:/config
      - ../../../../milestone2/cardano-node-ogmios/data/node-db:/data
      - ../../../../milestone2/cardano-node-ogmios/data/node-ipc:/ipc
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "400k"
        max-file: "20"
    networks:
      - default # internet
      # also talks to ogmios via socket

  ogmios:
    # The newest Ogmios release supports node 11 now, but it breaks the latest
    # PyCardano! So I'm keeping the custom hacky image a while longer:
    # image: cardanosolutions/ogmios:v7.0.0
    image: 3a21f883f83e # custom version i built for now
    restart: on-failure
    # The host here is 0.0.0.0 inside the container; 127.0.0.1 in ports below
    # limits that to only reachable by the host machine rather than LAN.
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/ipc/node.socket",
      "--node-config", "/config/cardano-node/config.json"
    ]
    volumes:
      # TODO make the same as the node one above?
      - ../../../../milestone2/cardano-node-ogmios/config/network/${NETWORK:-preview}:/config
      - ../../../../milestone2/cardano-node-ogmios/data/node-ipc:/ipc
    # TODO if containers can't access ogmios, try removing 127.0.0.1 here
    ports:
      - ${OGMIOS_PORT:-1337}:1337
    networks:
      - default
      # also talks to cardano-node via socket

  # In this test there's just one IPFS container.
  # I've tested already that a more realistic setup with a bunch of them also works.
  ipfs:
    image: ipfs/kubo:v0.42.0
    # Make IPFS data ephemeral:
    volumes:
      - type: tmpfs
        target: /data # TODO /data/ipfs?
    environment:
      - IPFS_TELEMETRY=off
    ports:
      - 4001:4001 # ipfs swarm
      - 5001:5001 # ipfs api (and webui on /webui)
    networks:
      - default
