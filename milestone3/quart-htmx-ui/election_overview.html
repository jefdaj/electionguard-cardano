{% extends "base.html" %}
{% block content %}
<div class="layout">
  <div class="left-pane">
    <h2>Chain Log</h2>
    <div id="log-container"
         hx-get="{{ url_for('log_fragment') }}"
         hx-trigger="load, every 3s"
         hx-target="#log-container"
         hx-swap="innerHTML">
      <!-- log fragment injected here -->
    </div>

    <h2>State</h2>
    <div id="state-container"
         hx-get="{{ url_for('state_fragment') }}"
         hx-trigger="load, every 5s"
         hx-target="#state-container"
         hx-swap="innerHTML">
      <!-- state tree fragment -->
    </div>
  </div>

  <div class="right-pane">
    <h2>Filter</h2>
    <form id="filter-form"
          hx-get="{{ url_for('filtered_fragments') }}"
          hx-target="#fragments-root"
          hx-include="#filter-form"
          hx-push-url="true">
      <input type="text" name="q" placeholder="Search artifacts / state…">
      <!-- extra filters as needed -->
    </form>

    <h2>Actions</h2>
    <div id="actions-container"
         hx-get="{{ url_for('actions_fragment') }}"
         hx-trigger="load"
         hx-target="#actions-container"
         hx-swap="innerHTML">
      <!-- role-based actions -->
    </div>
  </div>
</div>

<div id="modal-root">
  <!-- modal forms injected here -->
</div>

<div id="fragments-root" class="hidden">
  <!-- optional: wrapper if you update log+state together via filter -->
</div>
{% endblock %}
