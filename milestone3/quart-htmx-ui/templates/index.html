{% extends "base.html" %}
{% block content %}
<div class="layout">

  <div class="top-bar">
    <input 
      type="text" 
      name="filter" 
      id="filter-input"
      hx-get="{{ url_for('filter_results') }}"
      hx-trigger="keyup changed delay:200ms"
      hx-target="#filter-results"
      hx-swap="innerHTML"
      placeholder="Filter log entries...">
  </div>

  <div class="main-area">
    <div id="log-container"
         hx-target="#log-container"
         hx-ext="morph"
         hx-swap="morph">
      <!-- log fragment injected here -->
      Loading...
    </div>
  </div>
</div>

    {#
    <h2>State</h2>
    <div id="state-container"
         hx-get="{{ url_for('state_fragment') }}"
         hx-trigger="load, every 5s"
         hx-target="#state-container"
         hx-swap="innerHTML">
      <!-- state tree fragment -->
    </div>
  </div>
  #}

  {#
  <div class="bottom-bar">
    <h2>Actions</h2>
    <div id="actions-container"
         hx-get=" url_for('actions_fragment') "
         hx-trigger="load"
         hx-target="#actions-container"
         hx-swap="innerHTML">
      -- role-based actions --
    </div>
  </div>

<div id="modal-root">
  <!-- modal forms injected here -->
</div>

<div id="filter-results" 
     class="hidden"
     hx-get="{{ url_for('filter_results') }}" {# TODO remove? #}
     hx-trigger="load, every 5s [!document.activeElement.matches('#filter-input')]"
     hx-include="[name='filter']"
     hx-swap="innerHTML"
     hx-sync="this:replace">
  <!-- log+state results appear here and are moved via oob-swap -->
</div>
{% endblock %}
