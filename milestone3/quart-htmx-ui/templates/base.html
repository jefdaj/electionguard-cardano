<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>{% block title %}My Quart App{% endblock %}</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- Optional: HTMX extensions -->
    <!-- <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script> -->
    <!-- <script src="https://unpkg.com/htmx.org/dist/ext/debug.js"></script> -->
    
    <!-- Optional: Add your CSS framework (Bootstrap, Tailwind, etc.) -->
    {% block stylesheets %}
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline;
        }
        .htmx-request.htmx-indicator {
            display: inline;
        }
    </style>
    {% endblock %}
</head>
<body hx-boost="true">
    
    <header>
        {% block header %}
        <nav>
            <h1>My Quart + HTMX App</h1>
            <!-- Add your navigation here -->
        </nav>
        {% endblock %}
    </header>

    <main>
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <footer>
        {% block footer %}
        <p>&copy; 2026 My Quart App</p>
        {% endblock %}
    </footer>

    <!-- Optional: Global HTMX event handlers -->
    {% block scripts %}
    <script>
        // Example: Global error handling
        document.body.addEventListener('htmx:responseError', function(evt) {
            console.error('HTMX Error:', evt.detail);
        });
        
        // Example: Show loading indicator
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            console.log('Request started');
        });
        
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            console.log('Request completed');
        });
    </script>
    {% endblock %}

</body>
</html>
