<div id="history-log-container">
<ul class="history-log">
  {% for e in events %}
    <li class="event" id="event-{{ e.id }}">
      slot: {{ e.slot_no }}
      <br/>channel: {{ e.channel_id.decode('utf-8') }}
      <br/>action: {{ e.action }}
      <br/>
      <!-- height: {{ e.height }}
      type: {{ e.type }}
      <br/>summary: {{ e.summary }}
      <br/>timestamp: {{ e.timestamp }} -->
    </li>
  {% else %}
  {% endfor %}
</ul>
</div>
