<div id="history-log-container">
<ul class="history-log">
  {% for e in entries %}
    <li class="entry" id="entry-{{ e.id }}">
      id: {{ e.id }}
      height: {{ e.height }}
      type: {{ e.type }}
      <br/>summary: {{ e.summary }}
      <br/>timestamp: {{ e.timestamp }}
    </li>
  {% else %}
  {% endfor %}
</ul>
</div>
