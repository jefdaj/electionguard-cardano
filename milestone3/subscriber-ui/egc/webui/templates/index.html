{% extends "base.html" %}
{% block content %}

  {% include "history/index.html" %}

  <div id="top-bar">
    <input 
      type="text" 
      name="filter" 
      id="filter-input"
      hx-get="{{ url_for('filter_results') }}"
      hx-trigger="keyup changed delay:200ms"
      hx-target="#filter-results"
      hx-swap="innerHTML"
      placeholder="Filter entries...">
  </div>

  <div id="main-area">
    <div id="log-container"
         hx-ext="morph"
         hx-swap="morph">
      <!-- log fragment injected here -->
      Loading...
    </div>

    <div id="state-container"
         hx-ext="morph"
         hx-swap="morph">
      <!-- state tree fragment -->
    </div>
  </div>

</div>

  {#
  <div id="bottom-bar">
    <h2>Actions</h2>
    <div id="actions-container"
         hx-get=" url_for('actions_fragment') "
         hx-trigger="load"
         hx-target="#actions-container"
         hx-swap="innerHTML">
      -- role-based actions --
    </div>
  </div>
  #}

{#
<div id="modal-root">
  <!-- modal forms injected here -->
</div>
#}

<div id="filter-results" 
     class="hidden"
     hx-get="{{ url_for('filter_results') }}"
     hx-trigger="load, every 5s [!document.activeElement.matches('#filter-input')]"
     hx-include="[name='filter']"
     hx-swap="innerHTML"
     hx-sync="this:replace"
     hx-on::after-swap="if (!document.getElementById('filter-input').value.trim()) { lc = document.getElementById('log-container'); lc.scrollTop = lc.scrollHeight; }">
  <!-- filtered log+state injected here and moved via oob-swap -->
{% endblock %}
