[tool.hatch.build.targets.wheel]
packages = ["egc"]
# non-.py files under the package are included by default with hatchling;
# for setuptools use include_package_data + MANIFEST.in or package-data globs

[tool.setuptools.package-data]
"egc.webui" = ["static/**/*", "templates/**/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egc"
version = "0.0.0"
dependencies = ["quart"]

[tool.hatch.build.targets.wheel]
packages = ["src/egc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
