site_name: My Project
repo_url: https://github.com/jefdaj/electionguard-cardano
theme:
  name: material

validation:
  nav:
    not_found: info

nav:
  - Home: index.md
  - Nix: nix/packages.md
  - Getting started: getting-started.md
  - Aiken: aiken/index.html
  - Python: python.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
