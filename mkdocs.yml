site_name: My Project
repo_url: https://github.com/jefdaj/electionguard-cardano
theme:
  name: material

validation:
  nav:
    not_found: info

nav:
  - Home: index.md
  - Aiken: aiken_.md # underscore prevents recursive iframe
  - Nix: nix/packages.md
  - Getting started: getting-started.md
  # - Aiken: aiken/index.html
  - Python: python.md
  - Docker: docker.md

hooks:
  - hooks/compose_docs.py
watch:
  - docker-compose.yaml   # so `mkdocs serve` reloads when the file changes

# TODO try mkdocs serve


plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
