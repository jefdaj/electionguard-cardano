site_name: My Project
repo_url: https://github.com/jefdaj/electionguard-cardano
theme:
  name: material

validation:
  nav:
    not_found: info

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Python API: python.md
  - Aiken API: aiken/index.html
  - Nix packages: nix/packages.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
