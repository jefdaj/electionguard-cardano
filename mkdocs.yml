site_name: My Project
repo_url: https://github.com/jefdaj/electionguard-cardano
theme:
  name: material

nav:
  - Home: index.md
  - Python API: python.md
  - Nix packages: nix/packages.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
