services:
  cardano-node:
    image: ghcr.io/intersectmbo/cardano-node:11.0.1
    command: [
      "run",
      "--config", "/config/config.json",
      "--database-path", "/data/db",
      "--socket-path", "/ipc/node.socket",
      "--topology", "/config/topology.json"
    ]
    volumes:
      - ./config/network/${NETWORK:-preview}/cardano-node:/config
      - ./data/node-db:/data
      - ./data/node-ipc:/ipc
    restart: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "400k"
        max-file: "20"
    networks:
      - shared-net

  ogmios:
    # TODO does ktorz normally publish "latest" from the dev branch?
    # image: cardanosolutions/ogmios:v6.14.0
    image: 3a21f883f83e # custom version i built for now
    restart: on-failure
    command: [
      "--host", "0.0.0.0",
      "--node-socket", "/ipc/node.socket",
      "--node-config", "/config/cardano-node/config.json"
    ]
    volumes:
      - ./config/network/${NETWORK:-preview}:/config
      - ./data/node-ipc:/ipc
    ports:
      - ${OGMIOS_PORT:-1337}:1337
    networks:
      - shared-net

  # ---------------------------------------------------------------------------
  # One-shot Mithril bootstrap. Runs ONLY when the "bootstrap" profile is
  # active, so `docker compose up` won't touch it. Populates ./data/node-db/db
  # from a signed Mithril snapshot before the node's first start.
  #
  #   NETWORK=preview docker compose --profile bootstrap run --rm mithril
  #
  # Notes:
  #  - ./data/node-db -> /data, and we set --download-dir /data, so the
  #    snapshot unpacks to /data/db == ./data/node-db/db (what the node uses).
  #  - Full snapshot (incl. ledger state) => fast node startup.
  #  - Skips if a DB already exists.
  # ---------------------------------------------------------------------------
  mithril:
    profiles: ["bootstrap"]
    image: ghcr.io/intersectmbo/mithril-client:main-58b575a
    user: "${MITHRIL_UID:-0}:${MITHRIL_GID:-0}"
    environment:
      NETWORK: ${NETWORK:-preview}
      AGGREGATOR_ENDPOINT: ${MITHRIL_AGGREGATOR_ENDPOINT:-https://aggregator.pre-release-preview.api.mithril.network/aggregator}
      GENESIS_VERIFICATION_KEY: ${MITHRIL_GENESIS_VERIFICATION_KEY:?Set MITHRIL_GENESIS_VERIFICATION_KEY (see .env)}
      MITHRIL_ANCILLARY_VERIFICATION_KEY: ${MITHRIL_ANCILLARY_VERIFICATION_KEY:?Set MITHRIL_ANCILLARY_VERIFICATION_KEY (see .env)}
    volumes:
      - ./data/node-db:/data
    # entrypoint left as the image default (mithril-client)
    # command: ["cardano-db", "download", "latest", "--download-dir", "/data"]
    command:
      - "cardano-db"
      - "download"
      - "latest"
      - "--download-dir"
      - "/data"
      - "--include-ancillary"
      - "--ancillary-verification-key"
      - "${MITHRIL_ANCILLARY_VERIFICATION_KEY}"
    networks:
      - shared-net


# allow communication with other docker-compose networks, for example kupo
# TODO would just using the ipc socket work across networks instead?
networks:
  shared-net:
    driver: bridge
